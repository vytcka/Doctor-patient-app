name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: treatme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r flaskServer/requirements.txt

      - name: Run tests
        env:
        DATABASE_URL: postgresql://admin:password@postgres:5432/treatme
          SECRET_PEPPER: hello_world
          MASTER_KEY: prTdEe068PqcsLAomP8_MU4mQAQtZvQ7660-xZkqlfM=
          SECRET_KEY: supersecretkey
          FLASK_ENV: development
          RUNNING_IN_DOCKER: "false"
        run: pytest flaskServer/tests/ -v --tb=short